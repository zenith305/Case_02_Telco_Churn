name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # <--- ТОЧКА РОСТА №1: Кэширование пакетов

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest # Устанавливаем фреймворк для тестов

    # Важно: скрипт preprocess.py должен сгенерировать данные перед тестами!
    - name: Run preprocessing script
      run: python src/preprocess.py

    # --- ТОЧКА РОСТА №2: Запуск тестов ---
    - name: Test with pytest
      run: |
        pytest tests/

    - name: Lint with Ruff
      run: |
        pip install ruff
        ruff check src/ --output-format=github